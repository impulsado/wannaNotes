! =============================================================================
! EvilISP - AS 65100
! Malicious ISP executing the BGP hijack attack
!
! INITIAL STATE: Announces no prefixes
! AFTER THE HIJACK: Announces 1.1.1.0/25 (more specific than /24)
!
! The attack works because:
! - TorHost announces 1.1.1.0/24 (legitimate)
! - EvilISP announces 1.1.1.0/25 (more specific)
! - BGP ALWAYS prefers the longest prefix (longest prefix match)
! - Therefore, traffic is diverted to the attacker
! =============================================================================

frr defaults traditional
hostname EvilISP
log stdout

router bgp 65100
 bgp router-id 10.0.3.2
 no bgp ebgp-requires-policy

 ! BGP neighbor: ClientISP (AS 65003)
 neighbor 10.0.3.1 remote-as 65003
 neighbor 10.0.3.1 description ClientISP-victim

 address-family ipv4 unicast
  neighbor 10.0.3.1 activate
    ! NOTE: Initially we announce NOTHING
    ! The hijack is triggered by running: vtysh -f /etc/frr/hijack.vty
 exit-address-family