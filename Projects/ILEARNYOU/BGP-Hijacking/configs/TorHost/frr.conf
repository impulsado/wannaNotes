! =============================================================================
! TorHost - AS 65001
! ISP hosting the legitimate Tor Relay server
! Announces the 1.1.1.0/24 prefix to the Internet
! =============================================================================

frr defaults traditional
hostname TorHost
log stdout

router bgp 65001
 ! Unique router ID for this AS
 bgp router-id 10.0.1.1
 
 ! Disable mandatory eBGP policy (lab-only)
 no bgp ebgp-requires-policy

 ! BGP neighbor: Transit (AS 65002)
 neighbor 10.0.1.2 remote-as 65002
 neighbor 10.0.1.2 description Transit-ISP

 address-family ipv4 unicast
  ! ANNOUNCE THE TOR RELAY NETWORK (legitimate route)
  ! This is the prefix the attacker will attempt to hijack
    network 1.1.1.0/24
  
  neighbor 10.0.1.2 activate
 exit-address-family