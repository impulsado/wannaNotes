! =============================================================================
! ClientISP - AS 65003
! Victim client ISP
! Has two BGP peers:
!   - Transit (AS 65002): legitimate transit provider
!   - EvilISP (AS 65100): malicious peer that will perform the hijack
! =============================================================================

frr defaults traditional
hostname ClientISP
log stdout

router bgp 65003
 bgp router-id 10.0.2.2
 no bgp ebgp-requires-policy

 ! BGP neighbor: Transit (AS 65002) - legitimate upstream
 neighbor 10.0.2.1 remote-as 65002
 neighbor 10.0.2.1 description Transit-ISP

 ! BGP neighbor: EvilISP (AS 65100) - MALICIOUS PEER!
 ! In real life, this peering could have been established
 ! by mistake or via an unverified peering agreement
 neighbor 10.0.3.2 remote-as 65100
 neighbor 10.0.3.2 description EvilISP-ATTACKER

 address-family ipv4 unicast
  ! Announce the client network (so there is a return path)
    network 2.2.2.0/24
  
  neighbor 10.0.2.1 activate
  neighbor 10.0.3.2 activate
 exit-address-family
