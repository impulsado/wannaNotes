! =============================================================================
! Transit - AS 65002
! Transit ISP (backbone) - Only forwards routes between ASes
! Does not originate its own prefixes; transit only
! =============================================================================

frr defaults traditional
hostname Transit
log stdout

router bgp 65002
 bgp router-id 10.0.1.2
 no bgp ebgp-requires-policy

 ! BGP neighbor: TorHost (AS 65001) - upstream towards the Tor Relay
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.1.1 description TorHost-ISP

 ! BGP neighbor: ClientISP (AS 65003) - downstream towards clients
 neighbor 10.0.2.2 remote-as 65003
 neighbor 10.0.2.2 description ClientISP

 address-family ipv4 unicast
    ! Transit does not originate prefixes; it only forwards
  neighbor 10.0.1.1 activate
  neighbor 10.0.2.2 activate
 exit-address-family
